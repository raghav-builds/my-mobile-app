<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Budget & Expense Manager</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 pb-10">

    <!-- Header -->
    <header class="bg-indigo-600 text-white p-4 shadow-lg sticky top-0 z-10">
        <div class="max-w-xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-wallet"></i> Budget Manager
            </h1>
            <span class="text-xs bg-indigo-800 px-2 py-1 rounded-full" id="current-date"></span>
        </div>
    </header>

    <div class="max-w-xl mx-auto p-4 space-y-5">

        <!-- Summary Cards -->
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-emerald-500">
                <p class="text-xs text-gray-500 font-medium">Total Income</p>
                <p class="text-lg font-bold text-emerald-600" id="total-income">₹0</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-rose-500">
                <p class="text-xs text-gray-500 font-medium">Total Expense</p>
                <p class="text-lg font-bold text-rose-600" id="total-expense">₹0</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-blue-500">
                <p class="text-xs text-gray-500 font-medium">Net Balance</p>
                <p class="text-lg font-bold text-blue-600" id="net-balance">₹0</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-amber-500">
                <p class="text-xs text-gray-500 font-medium">Total Liabilities</p>
                <p class="text-lg font-bold text-amber-600" id="total-liabilities">₹0</p>
            </div>
        </div>

        <!-- Add Transaction Form -->
        <div class="bg-white p-5 rounded-xl shadow-md space-y-4">
            <h2 class="text-md font-bold text-gray-700 flex items-center gap-2">
                <i class="fa-solid fa-plus-circle text-indigo-600"></i> Add New Entry
            </h2>
            <form id="tracker-form" class="space-y-3">
                <div>
                    <label class="text-xs font-semibold text-gray-600">Type</label>
                    <select id="entry-type" class="w-full p-2.5 mt-1 border border-gray-300 rounded-lg text-sm bg-gray-50 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="income">🟢 Income (Aaye)</option>
                        <option value="expense">🔴 Expense (Kharcha)</option>
                        <option value="credit_card">💳 Credit Card Usage</option>
                        <option value="loan">🏦 Loan / EMI</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs font-semibold text-gray-600">Title / Description</label>
                    <input type="text" id="entry-title" placeholder="e.g. Salary, Grocery, HDFC Card Bill" required class="w-full p-2.5 mt-1 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="text-xs font-semibold text-gray-600">Amount (₹)</label>
                    <input type="number" id="entry-amount" placeholder="0.00" min="1" required class="w-full p-2.5 mt-1 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition duration-200 text-sm shadow">
                    Save Transaction
                </button>
            </form>
        </div>

        <!-- Recent Transactions -->
        <div class="bg-white p-5 rounded-xl shadow-md">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-md font-bold text-gray-700 flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-indigo-600"></i> History & Records
                </h2>
                <button onclick="clearAllData()" class="text-xs text-rose-500 hover:underline">Clear All</button>
            </div>
            <div id="transaction-list" class="space-y-2 max-h-80 overflow-y-auto divide-y divide-gray-100">
                <p class="text-xs text-gray-400 text-center py-4">Koi entry nahi hai. Nayi entry add karein!</p>
            </div>
        </div>

    </div>

    <!-- JavaScript Script -->
    <script>
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('hi-IN', { day: 'numeric', month: 'short', year: 'numeric' });

        let data = JSON.parse(localStorage.getItem('budgetData')) || [];

        const form = document.getElementById('tracker-form');
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const type = document.getElementById('entry-type').value;
            const title = document.getElementById('entry-title').value.trim();
            const amount = parseFloat(document.getElementById('entry-amount').value);

            if(title && amount) {
                const entry = {
                    id: Date.now(),
                    type,
                    title,
                    amount,
                    date: new Date().toLocaleDateString('hi-IN', { day: 'numeric', month: 'short' })
                };
                data.unshift(entry);
                saveAndUpdate();
                form.reset();
            }
        });

        function saveAndUpdate() {
            localStorage.setItem('budgetData', JSON.stringify(data));
            render();
        }

        function deleteEntry(id) {
            data = data.filter(item => item.id !== id);
            saveAndUpdate();
        }

        function clearAllData() {
            if(confirm("Kya aap saara data delete karna chahte hain?")) {
                data = [];
                saveAndUpdate();
            }
        }

        function render() {
            let totalIncome = 0;
            let totalExpense = 0;
            let totalLiabilities = 0; // Credit card + Loan

            const listEl = document.getElementById('transaction-list');
            listEl.innerHTML = '';

            if(data.length === 0) {
                listEl.innerHTML = '<p class="text-xs text-gray-400 text-center py-4">Koi entry nahi hai. Nayi entry add karein!</p>';
            }

            data.forEach(item => {
                let badgeColor = '';
                let typeText = '';

                if(item.type === 'income') {
                    totalIncome += item.amount;
                    badgeColor = 'bg-emerald-100 text-emerald-700';
                    typeText = 'Income';
                } else if(item.type === 'expense') {
                    totalExpense += item.amount;
                    badgeColor = 'bg-rose-100 text-rose-700';
                    typeText = 'Expense';
                } else if(item.type === 'credit_card') {
                    totalLiabilities += item.amount;
                    badgeColor = 'bg-amber-100 text-amber-700';
                    typeText = 'Credit Card';
                } else if(item.type === 'loan') {
                    totalLiabilities += item.amount;
                    badgeColor = 'bg-purple-100 text-purple-700';
                    typeText = 'Loan/EMI';
                }

                const row = document.createElement('div');
                row.className = 'flex justify-between items-center pt-2.5 pb-2.5';
                row.innerHTML = `
                    <div class="flex flex-col">
                        <span class="text-sm font-semibold text-gray-800">${item.title}</span>
                        <div class="flex items-center gap-2 mt-0.5">
                            <span class="text-[10px] px-2 py-0.5 rounded-full font-medium ${badgeColor}">${typeText}</span>
                            <span class="text-[11px] text-gray-400">${item.date}</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="text-sm font-bold ${item.type === 'income' ? 'text-emerald-600' : 'text-gray-700'}">
                            ${item.type === 'income' ? '+' : '-'}₹${item.amount.toLocaleString('en-IN')}
                        </span>
                        <button onclick="deleteEntry(${item.id})" class="text-gray-300 hover:text-rose-500 text-xs">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                `;
                listEl.appendChild(row);
            });

            document.getElementById('total-income').innerText = '₹' + totalIncome.toLocaleString('en-IN');
            document.getElementById('total-expense').innerText = '₹' + totalExpense.toLocaleString('en-IN');
            document.getElementById('total-liabilities').innerText = '₹' + totalLiabilities.toLocaleString('en-IN');
            document.getElementById('net-balance').innerText = '₹' + (totalIncome - totalExpense).toLocaleString('en-IN');
        }

        render();
    </script>
</body>
</html>
